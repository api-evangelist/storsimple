name: StorSimple
description: >-
  StorSimple was a Santa Clara, California hybrid cloud storage company founded in 2009
  by Ursheet Parikh and Guru Pangal. Its appliances combined primary storage, tiered
  cloud archiving, deduplication, compression, and encryption behind iSCSI/SMB
  interfaces, backed by $31.5M from Index Ventures, Redpoint Ventures, Ignition
  Partners, and Mayfield Fund. Microsoft acquired StorSimple in November 2012 and
  folded it into Azure as Azure StorSimple (8000 series physical and virtual arrays,
  plus the StorSimple Data Manager). The product is managed through Azure Resource
  Manager under the Microsoft.StorSimple resource provider and its REST API. Azure
  StorSimple reached end-of-life in December 2022 and is out of support; Microsoft
  directs customers to Azure File Sync and Azure Files.
